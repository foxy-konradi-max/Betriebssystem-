name: Build FluidOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Live-Build und Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools genisoimage xorriso

      - name: Build-Skript ausführen
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: ISO-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FluidOS-ISO
          path: '*.iso'
